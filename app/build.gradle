plugins {
    id 'java'    // 使用内置插件（自带版本）
    // 提供一个纯粹的依赖版本管理（BOM 消费）能力，不附带任何构建任务或打包行为
    /**
     * 在 Spring Boot 项目中，只要应用了 org.springframework.boot 插件（或手动引入了 spring-boot-dependencies BOM），Gradle 会自动解析以下依赖的版本：
     * 1. 所有 org.springframework.boot:spring-boot-starter-* 起步依赖
     * 2. Spring Boot 认可的第三方集成库（如 PostgreSQL 驱动、Flyway、H2、Prometheus 等）
     * 这些库的版本都已经在 Spring Boot 的 BOM 中声明好了，Gradle 会自动选取与当前 Spring Boot 版本兼容的版本
     */
    alias(libs.plugins.spring.dependency.management)
    // 将 Spring Boot 的构建特性注入到项目中
    alias(libs.plugins.spring.boot)
}

// 组织标识（Maven 坐标的一部分）
group = 'com.ywy.interview'
version = '0.0.1-SNAPSHOT'    // 项目版本
description = 'Interview-Agent-Application' // 项目描述

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'    // 健康检查 + Prometheus
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'      // REST API（Tomcat 嵌入式）
    implementation 'org.springframework.boot:spring-boot-starter-validation'  // @Valid / @NotBlank 校验
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'    // JPA + Hibernate + 连接池
    implementation 'org.springframework.boot:spring-boot-starter-websocket'   // WebSocket 语音面试
    implementation 'org.springframework.boot:spring-boot-starter-flyway'      // 数据库版本迁移

    // PostgreSQL 驱动 + Flyway PG 适配
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'

    // H2 内存数据库（仅测试使用）
    testRuntimeOnly 'com.h2database:h2'

    // Spring AI Agent Utils BOM（platform 用于版本对齐）
    implementation platform(libs.spring.ai.agent.utils.bom)

    // Spring AI 2.0 - 为 Spring Boot 应用提供与 OpenAI 兼容的大模型（如 GPT-5、DeepSeek 等）进行交互的“一站式”集成方案
    implementation "org.springframework.ai:spring-ai-starter-model-openai:${libs.versions.springAi.get()}"
    // Spring AI 2.0 - pgvector 向量存储
    implementation "org.springframework.ai:spring-ai-starter-vector-store-pgvector:${libs.versions.springAi.get()}"
    // Spring AI Agent Utils 核心，用于结构化输出辅助等
    implementation libs.spring.ai.agent.utils

    // Apache Tika——文档解析（PDF / DOCX / TXT）
    implementation libs.tika.core
    implementation libs.tika.parsers

    // AWS S3 SDK——RustFS 存储（兼容 S3 协议）
    implementation "software.amazon.awssdk:s3:${libs.versions.aws.sdk.get()}"

    // Pinyin4j——汉字转拼音
    implementation libs.pinyin4j

    // SpringDoc OpenAPI——Swagger UI 接口文档
    implementation libs.springdoc

    // Redisson 4.0——Redis 客户端（含分布式锁、限流器等高级能力）
    implementation "org.redisson:redisson-spring-boot-starter:${libs.versions.redisson.get()}"

    // Prometheus 指标端点——供 Actuator 暴露 /actuator/prometheus
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

    // iText 8——PDF 报告导出
    implementation "com.itextpdf:itext-core:${libs.versions.itext.get()}"
    implementation "com.itextpdf:font-asian:${libs.versions.itext.get()}"

    // 阿里云 DashScope SDK——Qwen3 ASR / TTS 语音服务
    implementation('com.alibaba:dashscope-sdk-java:2.22.7') {
        exclude group: 'org.slf4j', module: 'slf4j-simple' // 与 Spring Boot Logback 冲突，排除
    }

    // Jakarta Annotation API（Java 21+ 中 javax.annotation 已被移除）
    implementation 'jakarta.annotation:jakarta.annotation-api:2.1.1'

    // Lombok——编译期生成 Getter/Setter/构造器
    compileOnly libs.lombok
    annotationProcessor libs.lombok

    // MapStruct——编译期生成 Entity ↔ DTO 映射代码
    implementation "org.mapstruct:mapstruct:${libs.versions.mapstruct.get()}"
    annotationProcessor "org.mapstruct:mapstruct-processor:${libs.versions.mapstruct.get()}"
    // Lombok + MapStruct 协同绑定
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'

    // ===== 测试 =====
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation libs.junit.jupiter
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain {
        /**
         * 指定这个项目里的所有 Java 编译、测试、运行任务，都使用 JDK 25 来执行
         *
         * 当 Gradle 执行当前项目的 compileJava、test、bootRun 等任务时，它会：
         * 检查当前机器上是否已经安装了符合条件的 JDK（通过自动探测或你手动指定的路径）。
         * 如果找不到，并且你开启了自动下载（默认开启），Gradle 会通过 Foojay Resolver 从网络下载一个对应的 JDK（比如 Adoptium、Zulu 等发行版） 到仓库中。
         * 将这个 JDK 提供给 JavaCompile、Test、JavaExec 等任务使用。
         */
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// 全局 UTF-8 编码——避免 Windows 环境下中文乱码
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25  // 编译输出兼容 Java 25 字节码
}

tasks.named('test') {
    useJUnitPlatform()
    // --enable-native-access：Java 22+ 外部函数与内存 API 需要此标志
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

// bootRun 任务特殊配置：加载 .env 文件 + JVM UTF-8
tasks.named('bootRun') {
    // JVM 编码——确保 stdout/stderr 控制台正确输出中文
    jvmArgs = [
            '-Dfile.encoding=UTF-8',
            '-Dconsole.encoding=UTF-8',
            '-Dstdout.encoding=UTF-8',
            '-Dstderr.encoding=UTF-8',
             '--enable-native-access=ALL-UNNAMED'
    ]

    // 加载根目录 .env 文件中的环境变量
    // Gradle 进程默认不读取 .env，这里手动解析并注入到 JVM 系统属性
    def envFile = rootProject.file('.env')
    if (envFile.exists()) {
        envFile.eachLine { line ->
            def trimmed = line.trim()
            // 跳过空行和注释行
            if (trimmed.isEmpty() || trimmed.startsWith('#')) {
                return
            }
            def eq = trimmed.indexOf('=')
            if (eq <= 0) {
                return
            }
            def key = trimmed.substring(0, eq).trim()
            def val = trimmed.substring(eq + 1).trim()
            // 剥离行内注释：值后以 # 开头且前面是空白时，视为注释（如 `KEY=value # 注释`）
            def commentIdx = val.indexOf('#')
            if (commentIdx > 0 && (val.charAt(commentIdx - 1) == ' ' || val.charAt(commentIdx - 1) == '\t')) {
                val = val.substring(0, commentIdx).trim()
            }
            // 去除引号包裹的值
            if ((val.startsWith('"') && val.endsWith('"')) || (val.startsWith("'") && val.endsWith("'"))) {
                val = val.substring(1, val.length() - 1)
            }
            environment key, val
        }
    }
}
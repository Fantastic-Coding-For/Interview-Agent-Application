# Gradle 存储路径配置
# 1. Gradle 发行版（解压后的文件）存放的根目录。GRADLE_USER_HOME 默认是用户目录下的 .gradle 文件夹（如 ~/.gradle）。
distributionBase=GRADLE_USER_HOME
# 2. 相对于 distributionBase 的子路径。合起来完整路径是 ~/.gradle/wrapper/dists/。
distributionPath=wrapper/dists
# 3. 存放下载的 ZIP 压缩包的位置（通常与解压根目录相同，避免重复占用空间）
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists

# 指定 Gradle 的下载地址与版本
# 后缀 -bin 的含义：仅包含二进制文件和 API 文档（推荐，体积小）。
# 若后缀为 -all：包含源代码和文档（体积大，用于调试 Gradle 自身）。
distributionUrl=https\://services.gradle.org/distributions/gradle-9.6.1-bin.zip

# 网络与重试策略
# 1. 网络连接超时时间（毫秒）
networkTimeout=10000
# 2. 下载失败后的重试次数。0 表示失败后直接报错，绝不重试
retries=1
# 3. 每次重试之间的等待间隔（毫秒）。500 = 0.5 秒
retryBackOffMs=500

# 安全校验
# 1. 下载完成后，Gradle 会校验下载文件的 SHA-256 校验和，
# 确保下载的 ZIP 包未被篡改，且与 Gradle 官方发布的文件完全一致。
# 防止分发劫持
validateDistributionUrl=true